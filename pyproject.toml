[project]
name = "efm-corrective-rag"
version = "0.1.0"
description = "Multi-tenant Corrective RAG for facility management."
requires-python = ">=3.11"
dependencies = [
    "docling>=2.151.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langgraph>=1.0.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.3",
    "transformers>=5.24.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "isolation: tenant isolation integration tests",
    "eval: retrieval and answer quality evaluation tests",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
